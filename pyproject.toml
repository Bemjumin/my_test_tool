[project]
name = "pyqt-agent"
version = "0.1.0"
description = "在 Windows 上按 Word 需求书黑盒测试已打包的 PyQt 程序"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-docx>=1.1.0",
    "Pillow>=10.0.0",
    "cursor-sdk>=1.0.24",
]

[project.optional-dependencies]
windows = ["pywinauto>=0.6.8"]
dev = ["pytest>=8.0.0"]

[project.scripts]
agent = "pyqt_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
